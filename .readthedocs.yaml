# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html


# Required
version: 2

# https://github.com/readthedocs/readthedocs.org/issues/7883
# Since readthedocs doesn't support separate configuration and source directories,
# we need to add a pre_build step to copy conf.py (and associated files) to the
# source directory.

# Set the version of Python and other tools you might need
build:
  os: ubuntu-lts-latest
  tools:
    python: latest
  apt_packages:
    - graphviz
  jobs:
    pre_build:
      - cp -rf scripts/sphinx/conf.py docs/
      - cp -rf scripts/sphinx/_static docs/

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Optionally declare the Python requirements required to build your docs
python:
  install:
    - requirements: scripts/sphinx/requirements.txt
